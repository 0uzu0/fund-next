# 根据 mobile 目录构建 Android APK：支持按 tag 推送自动发布、手动触发（可选指定已存在的 tag 发布）
# 不在 Action 中创建 tag，避免与本地 git tag 冲突；仅对「已存在的 tag」创建/更新 Release 并上传 APK
name: Android APK Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已存在的版本标签（如 v1.0.0）。留空仅产出 Artifact；填写则必须已推送该 tag，会为该 tag 创建/更新 Release 并上传 APK'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 推送 tag 时用该 tag；手动触发时先拉默认分支，若填了 release_tag 下一步会 fetch 并 checkout 到该 tag
          ref: ${{ github.event_name == 'push' && github.ref || github.ref }}
          fetch-depth: 0

      # 手填 release_tag：拉取远程 tag 并校验已存在，再 checkout 到该 tag 构建，避免与本地 tag 冲突
      - name: Fetch and checkout release tag (manual run with tag)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          git fetch origin tag "$TAG" --no-tags 2>/dev/null || git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::未找到 tag '$TAG'。请先在本地创建并推送该 tag 后再运行此流程，例如："
            echo "  git tag $TAG"
            echo "  git push origin $TAG"
            exit 1
          fi
          git checkout "refs/tags/$TAG"
          echo "Building at tag $TAG ($(git rev-parse HEAD))"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache mobile node_modules
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: mobile-${{ hashFiles('mobile/package.json') }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit || npm install

      # 不注入写死地址，APK 完全使用应用内「服务端地址」页用户填写并保存的地址
      - name: Build APK
        run: npm run mobile:build:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: morefund-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Create/Update Release & Upload APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: morefund-android-apk

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK for release
        run: mv app-release.apk "morefund-${{ steps.tag.outputs.tag }}.apk"

      - name: Create or Update Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: "morefund-${{ steps.tag.outputs.tag }}.apk"
          generate_release_notes: true
          draft: false
          # 允许更新已有 Release（同一 tag 重跑或重新推送时不再报错，与本地 tag 重推场景兼容）
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
