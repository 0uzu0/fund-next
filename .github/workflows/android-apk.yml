# 根据 mobile 目录构建 Android APK：支持手动触发、按 tag 自动打包并发布 Release
name: Android APK Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本标签（留空仅产出 Artifact；填如 v1.0.0 则创建 Release 并上传 APK）'
        required: false
        type: string
      web_url:
        description: '前端 Web 地址（WebView 加载用，如 https://your-domain.com；留空则使用 10.0.2.2:3000，仅适用于模拟器）'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache mobile node_modules
        uses: actions/cache@v4
        with:
          path: mobile/node_modules
          key: mobile-${{ hashFiles('mobile/package.json') }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --prefer-offline --no-audit || npm install

      # WebView 加载的前端地址：手动触发可填 web_url；按 tag 推送请在仓库 Settings → Variables 中配置 PRODUCTION_WEB_URL（如 https://你的前端域名）
      - name: Set Web URL for WebView
        id: weburl
        run: |
          if [ -n "${{ github.event.inputs.web_url }}" ]; then
            echo "url=${{ github.event.inputs.web_url }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ vars.PRODUCTION_WEB_URL }}" ]; then
            echo "url=${{ vars.PRODUCTION_WEB_URL }}" >> $GITHUB_OUTPUT
          else
            echo "url=" >> $GITHUB_OUTPUT
          fi

      # 与本地构建一致：使用 mobile/scripts/build-apk.js（prebuild ± --clean、local.properties、gradlew assembleRelease）
      - name: Build APK (local script)
        working-directory: mobile
        env:
          EXPO_PUBLIC_WEB_URL: ${{ steps.weburl.outputs.url }}
        run: node scripts/build-apk.js

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfund-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Create Release & Upload APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: |
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
    permissions:
      contents: write   # 创建 Release、上传 APK 附件必需
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfund-android-apk

      - name: Set release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Rename APK for release
        run: mv app-release.apk "lanfund-${{ steps.tag.outputs.tag }}.apk"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: "lanfund-${{ steps.tag.outputs.tag }}.apk"
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
