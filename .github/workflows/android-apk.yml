# 根据 mobile 目录构建 Android APK，手动触发，可选发布为 GitHub Release
name: Android APK Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布版本标签（留空仅产出 Artifact，填写如 v1.0.0 则创建 Release 并上传 APK）'
        required: false
        type: string

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: nbarrientos/setup-android-sdk@v2
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfund-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk

  release:
    name: Create Release & Upload APK
    runs-on: ubuntu-latest
    needs: build-apk
    if: github.event.inputs.release_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfund-android-apk

      - name: Rename APK for release
        run: mv app-release.apk "lanfund-${{ github.event.inputs.release_tag }}.apk"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          files: "lanfund-${{ github.event.inputs.release_tag }}.apk"
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
