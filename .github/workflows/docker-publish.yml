# 服务端 Docker 镜像打包与发布，手动触发
# 构建上下文为仓库根目录，产出镜像推送至 GitHub Container Registry
name: Docker 服务端镜像构建与发布

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（默认 latest，可填如 v1.0.0）'
        required: false
        type: string
        default: 'latest'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag || 'latest' }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
