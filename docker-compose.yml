version: '3.8'

# 使用 Action 打包的镜像：在 .env 中设置 DOCKER_IMAGE=ghcr.io/<你的 GitHub 用户名>/<仓库名>:latest
# 例如：DOCKER_IMAGE=ghcr.io/username/fund-next:latest
# 部署时使用宿主机时间：挂载 /etc/localtime（Linux），可设置 TZ=Asia/Shanghai
services:
  app:
    image: ${DOCKER_IMAGE:?请设置 .env 中的 DOCKER_IMAGE，例如 ghcr.io/username/fund-next:latest}
    container_name: fund-app
    restart: unless-stopped
    ports:
      - "8311:8311"
    environment:
      - NODE_ENV=production
      - PORT=8311
      - DB_PATH=/app/data/fund_data.db
      - SESSION_PATH=/app/data/sessions
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-key}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - fund-data:/app/data
      - ./backend/cache:/app/cache
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8311/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  fund-data:
