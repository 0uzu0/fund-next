# LanFund 服务端 Docker Compose
# 使用前在 .env 中设置 DOCKER_IMAGE 与 SESSION_SECRET（见 .env.example）
# 持久化：fund-data 卷必须保留，否则重启后基金列表、用户数据等会丢失
version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:?请设置 .env 中的 DOCKER_IMAGE，例如 ghcr.io/用户名/fund-next:latest}
    container_name: fund-app
    restart: unless-stopped
    ports:
      - "8311:8311"
    environment:
      NODE_ENV: production
      PORT: "8311"
      DB_PATH: /app/data/fund_data.db
      SESSION_PATH: /app/data/sessions
      SESSION_SECRET: ${SESSION_SECRET:?请设置 .env 中的 SESSION_SECRET}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - fund-data:/app/data   # 持久化：数据库 fund_data.db、会话等
      - backend-cache:/app/cache
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8311/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  fund-data:    # 勿删：存储 fund_data.db（基金列表、用户、组合等）及 sessions
  backend-cache:
